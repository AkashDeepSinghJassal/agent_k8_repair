apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-b
  namespace: demo-b
  labels:
    app: api-b
    app.kubernetes.io/version: "1.0.0"
  annotations:
    repair.example.dev/source-path: deploy/demo-b/api-b.yaml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-b
  template:
    metadata:
      labels:
        app: api-b
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: api-b
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          envFrom:
            - configMapRef:
                name: api-b-config
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 500m
      volumes:
        - name: code
          configMap:
            name: api-b-code
---
apiVersion: v1
kind: Service
metadata:
  name: api-b
  namespace: demo-b
  labels:
    app: api-b
    app.kubernetes.io/version: "1.0.0"
  annotations:
    repair.example.dev/source-path: deploy/demo-b/api-b.yaml
spec:
  selector:
    app: api-b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
