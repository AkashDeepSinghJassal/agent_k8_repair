apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: demo
  labels:
    app.kubernetes.io/version: "1.0.0"
data:
  DB_URL: redis://redis:6379
  LOG_LEVEL: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-code
  namespace: demo
  labels:
    app.kubernetes.io/version: "1.0.0"
data:
  app.py: |
    import json
    import os
    import sys
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    DB_URL = os.environ.get("DB_URL")
    if not DB_URL:
        print("DB_URL not set", file=sys.stderr, flush=True)
        sys.exit(1)

    APP_VERSION = os.environ.get("APP_VERSION", "unknown")
    LOG_LEVEL = os.environ.get("LOG_LEVEL", "info")

    # Keep ~60 MiB resident so the 128Mi container limit is meaningfully used.
    BALLAST = bytearray(60 * 1024 * 1024)

    _lock = threading.Lock()
    _items = 0


    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            global _items
            if self.path == "/healthz":
                self._send(200, {"status": "ok"})
            elif self.path == "/version":
                self._send(200, {"version": APP_VERSION})
            elif self.path == "/items":
                with _lock:
                    _items += 1
                    count = _items
                self._send(200, {"items": count})
            else:
                self._send(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            if LOG_LEVEL != "error":
                sys.stdout.write("%s %s\n" % (self.address_string(), fmt % args))
                sys.stdout.flush()


    if __name__ == "__main__":
        print("api starting version=%s" % APP_VERSION, flush=True)
        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-code
  namespace: demo
  labels:
    app.kubernetes.io/version: "1.0.0"
data:
  worker.py: |
    import time

    print("worker starting", flush=True)
    beat = 0
    while True:
        beat += 1
        print("heartbeat %d" % beat, flush=True)
        time.sleep(10)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: demo
  labels:
    app.kubernetes.io/version: "1.0.0"
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>repair-demo</title>
    </head>
    <body>
      <h1>repair-demo</h1>
      <p>Frontend version: <span id="fe-version">1.0.0</span></p>
      <p>API version: <span id="api-version">unknown</span></p>
      <p>API health: <span id="api-health">checking</span></p>
      <script>
        fetch("/api/version")
          .then(function (r) { return r.json(); })
          .then(function (j) { document.getElementById("api-version").textContent = j.version; })
          .catch(function () { document.getElementById("api-version").textContent = "unreachable"; });
        fetch("/api/healthz")
          .then(function (r) { document.getElementById("api-health").textContent = r.ok ? "ok" : "down"; })
          .catch(function () { document.getElementById("api-health").textContent = "down"; });
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: demo
  labels:
    app.kubernetes.io/version: "1.0.0"
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://api:8000/;
      }

      location / {
        try_files $uri /index.html;
      }
    }
