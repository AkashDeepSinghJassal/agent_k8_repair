<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repair loop dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#incidents">Skip to repair incidents</a>
<header class="top">
  <div>
    <h1>Self-repair loop</h1>
    <p class="sub">Demo cluster view and controls</p>
  </div>
  <div class="status" role="status" aria-live="polite">
    <span id="cluster-dot" class="dot dot-unknown" aria-hidden="true"></span>
    <span id="cluster-text">Connecting...</span>
    <span id="updated" class="muted"></span>
    <label class="muted" for="agent-provider">Agent</label>
    <select id="agent-provider" class="btn" aria-label="Agent provider"></select>
    <button id="refresh" type="button" class="btn">Refresh now</button>
  </div>
</header>

<main>
  <section aria-labelledby="h-services">
    <h2 id="h-services">Services</h2>
    <div id="services" class="ns-groups"></div>
  </section>

  <div class="two-col">
    <section aria-labelledby="h-gitops">
      <h2 id="h-gitops">GitOps (Argo CD)</h2>
      <div id="gitops"></div>
    </section>
    <section aria-labelledby="h-pipelines">
      <h2 id="h-pipelines">Pipelines (Argo Workflows)</h2>
      <div class="actions"><button id="rerun" type="button" class="btn">Re-run pipeline</button><span id="rerun-msg" class="muted" role="status"></span></div>
      <div id="pipelines"></div>
    </section>
  </div>

  <section id="incidents" aria-labelledby="h-incidents">
    <h2 id="h-incidents">Repair incidents</h2>
    <div id="incident-list"></div>
  </section>

  <section aria-labelledby="h-faults" class="faults">
    <h2 id="h-faults">Fault injection</h2>
    <div id="gh-banner" class="error" role="alert" hidden></div>
    <div id="fault-panel" class="cards fault-cards" aria-busy="true"><p class="muted">Loading faults...</p></div>
  </section>

  <section aria-labelledby="h-log">
    <h2 id="h-log">Activity log</h2>
    <ol id="activity" class="activity" aria-label="Activity log"><li class="muted">No actions yet.</li></ol>
  </section>
</main>

<aside id="drawer" class="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <h3 id="drawer-title">Incident</h3>
    <button id="drawer-close" type="button" class="btn" aria-label="Close incident details">Close</button>
  </div>
  <div id="drawer-body"></div>
</aside>

<dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <form method="dialog">
    <h3 id="confirm-title">Confirm</h3>
    <div id="confirm-body"></div>
    <div class="dialog-actions">
      <button id="confirm-cancel" type="button" class="btn">Cancel</button>
      <button id="confirm-ok" type="button" class="btn btn-danger">Confirm</button>
    </div>
  </form>
</dialog>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
