apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repairincidents.repair.example.dev
spec:
  group: repair.example.dev
  scope: Namespaced
  names:
    kind: RepairIncident
    plural: repairincidents
    singular: repairincident
    shortNames: [ri]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Class, type: string, jsonPath: .status.classification.class}
        - {name: Tier, type: integer, jsonPath: .status.proposal.tier}
        - {name: PR, type: string, jsonPath: .status.pullRequest}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [source, fingerprint]
              properties:
                source:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                fingerprint:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
