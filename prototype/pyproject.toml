[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repair-loop"
version = "0.1.0"
description = "Prototype repair loop: Kubernetes operator, dashboard and fault tooling"
requires-python = ">=3.11"
dependencies = [
    "kopf",
    "kubernetes",
    "PyGithub",
    "pydantic>=2",
    "jsonschema",
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repair_operator", "src/repair_dashboard", "src/repair_faults"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs a running cluster, GitHub or the Anthropic API; skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py311"
